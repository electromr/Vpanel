{% extends 'base.html' %}

{% block title %}Edit User{% endblock %}

{% block content %}
<style>
    .pve-card {
        background-color: var(--pve-panel);
        border: 1px solid var(--pve-border);
        border-radius: 6px;
        box-shadow: 0 2px 6px rgba(0, 0, 0, 0.3);
        overflow: hidden;
        max-width: 600px;
        margin: 2rem auto;
    }

    .pve-header {
        background-color: var(--pve-header);
        border-bottom: 1px solid var(--pve-border);
        padding: 1rem 1.5rem;
        color: #ffffff;
        font-weight: 600;
        font-size: 1.3rem;
    }

    .pve-body {
        padding: 1.5rem;
        color: var(--pve-text);
    }

    .pve-body .form-label {
        font-size: 0.85rem;
        color: var(--pve-text-muted);
        font-weight: 500;
        margin-bottom: 0.5rem;
    }

    .pve-body .form-control,
    .pve-body .form-select {
        background-color: #3a3a3a;
        border: 1px solid var(--pve-border);
        color: var(--pve-text);
        border-radius: 4px;
        padding: 0.65rem 0.75rem;
        font-size: 0.95rem;
        transition: all 0.2s;
    }

    .pve-body .form-control:focus,
    .pve-body .form-select:focus {
        border-color: var(--pve-accent);
        box-shadow: 0 0 0 2px rgba(0, 122, 204, 0.25);
        background-color: #3a3a3a;
        color: var(--pve-text);
    }

    .pve-body .form-control::placeholder {
        color: #777;
    }

    .pve-body .form-text {
        font-size: 0.8rem;
        color: #888;
        margin-top: 0.35rem;
    }

    .pve-body .btn {
        border-radius: 4px;
        font-weight: 500;
        padding: 0.65rem 1.2rem;
        min-width: 130px;
        transition: all 0.2s;
    }

    .pve-body .btn-primary {
        background-color: var(--pve-accent);
        border-color: var(--pve-accent);
    }

    .pve-body .btn-primary:hover {
        background-color: var(--pve-accent-hover);
        border-color: var(--pve-accent-hover);
    }

    @media (max-width: 768px) {
        .pve-card {
            margin: 1rem;
            border-radius: 4px;
        }
        .pve-body {
            padding: 1rem;
        }
        .pve-body .btn {
            width: 100%;
        }
    }
</style>

<div class="container-fluid mt-4">
    <div class="pve-card">
        <div class="pve-header">
            <h4>Edit User {{ user.username }}</h4>
        </div>
        <div class="pve-body">
            <form method="post">
                <div class="mb-3">
                    <label for="username" class="form-label">Username</label>
                    <input type="text" class="form-control" id="username" name="username" value="{{ user.username }}" required>
                </div>

                <div class="mb-3">
                    <label for="password" class="form-label">New Password</label>
                    <input type="password" class="form-control" id="password" name="password" minlength="12" placeholder="Leave blank to keep current">
                    <div class="form-text">Minimum 12 characters. Leave empty to keep current password.</div>
                </div>

                <div class="mb-3">
                    <label for="email" class="form-label">Email</label>
                    <input type="email" class="form-control" id="email" name="email" value="{{ user.email or '' }}" placeholder="user@example.com">
                </div>

                <div class="mb-3">
                    <label for="role" class="form-label">Role</label>
                    <select class="form-select" id="role" name="role">
                        <option value="user" {% if user.role == 'user' %}selected{% endif %}>User</option>
                        <option value="admin" {% if user.role == 'admin' %}selected{% endif %}>Admin</option>
                    </select>
                </div>

                <div class="d-grid">
                    <button type="submit" class="btn btn-primary">Save Changes</button>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
