{% extends 'base.html' %}

{% block title %}Create VPS{% endblock %}

{% block content %}
<style>
    .pve-card {
        background-color: var(--pve-panel);
        border: 1px solid var(--pve-border);
        border-radius: 6px;
        box-shadow: 0 2px 6px rgba(0, 0, 0, 0.3);
        overflow: hidden;
        max-width: 900px;
        margin: 2rem auto;
    }

    .pve-header {
        background-color: var(--pve-header);
        border-bottom: 1px solid var(--pve-border);
        padding: 1rem 1.5rem;
        color: #ffffff;
        font-weight: 600;
        font-size: 1.3rem;
    }

    .pve-body {
        padding: 1.5rem;
        color: var(--pve-text);
    }

    .pve-body .alert {
        border-radius: 4px;
        font-size: 0.9rem;
        padding: 0.75rem 1rem;
        margin-bottom: 1.25rem;
    }

    .pve-body .form-label {
        font-size: 0.85rem;
        color: var(--pve-text-muted);
        font-weight: 500;
        margin-bottom: 0.5rem;
    }

    .pve-body .form-control,
    .pve-body .form-select {
        background-color: #3a3a3a;
        border: 1px solid var(--pve-border);
        color: var(--pve-text);
        border-radius: 4px;
        padding: 0.65rem 0.75rem;
        font-size: 0.95rem;
        transition: all 0.2s;
    }

    .pve-body .form-control:focus,
    .pve-body .form-select:focus {
        border-color: var(--pve-accent);
        box-shadow: 0 0 0 2px rgba(0, 122, 204, 0.25);
        background-color: #3a3a3a;
        color: var(--pve-text);
    }

    .pve-body .form-control::placeholder {
        color: #777;
    }

    .pve-body .btn {
        border-radius: 4px;
        font-weight: 500;
        padding: 0.65rem 1.2rem;
        min-width: 120px;
        transition: all 0.2s;
        margin-right: 0.75rem;
    }

    .pve-body .btn-primary {
        background-color: var(--pve-accent);
        border-color: var(--pve-accent);
    }

    .pve-body .btn-primary:hover {
        background-color: var(--pve-accent-hover);
        border-color: var(--pve-accent-hover);
    }

    .pve-body .btn-secondary {
        background-color: #5a5a5a;
        border-color: #5a5a5a;
        color: #e0e0e0;
    }

    .pve-body .btn-secondary:hover {
        background-color: #4a4a4a;
        border-color: #4a4a4a;
    }

    .pve-body .row {
        margin-left: -0.75rem;
        margin-right: -0.75rem;
    }

    .pve-body .col-md-4 {
        padding-left: 0.75rem;
        padding-right: 0.75rem;
    }

    .pve-body .mb-3 {
        margin-bottom: 1.25rem !important;
    }

    @media (max-width: 768px) {
        .pve-card {
            margin: 1rem;
            border-radius: 4px;
        }
        .pve-body {
            padding: 1rem;
        }
        .pve-body .row {
            margin-left: 0;
            margin-right: 0;
        }
        .pve-body .col-md-4 {
            padding-left: 0;
            padding-right: 0;
            margin-bottom: 1rem;
        }
        .pve-body .btn {
            width: 100%;
            margin-bottom: 0.5rem;
            margin-right: 0;
        }
    }
</style>

<div class="container-fluid mt-4">
    <div class="pve-card">
        <div class="pve-header">
            <h4>Create New VPS</h4>
        </div>
        <div class="pve-body">
            {% if error %}
            <div class="alert alert-danger">
                {{ error }}
            </div>
            {% endif %}

            <form method="post" enctype="multipart/form-data">
                {% if users %}
                <div class="mb-3">
                    <label for="user_id" class="form-label">Select User</label>
                    <select class="form-select" id="user_id" name="user_id" required>
                        {% for user in users %}
                        <option value="{{ user.id }}">{{ user.username }}</option>
                        {% endfor %}
                    </select>
                </div>
                {% endif %}

                <div class="mb-3">
                    <label for="os_image" class="form-label">OS Image</label>
                    <select class="form-select" id="os_image" name="os_image" required>
                        <option value="">-- Select Image --</option>
                        {% for img in os_images %}
                        <option value="{{ img }}">{{ img }}</option>
                        {% endfor %}
                    </select>
                </div>

                <div class="row">
                    <div class="col-md-4 mb-3">
                        <label for="memory" class="form-label">Memory (GB)</label>
                        <input type="number" class="form-control" id="memory" name="memory" min="1" max="512" required value="2">
                    </div>
                    <div class="col-md-4 mb-3">
                        <label for="cpu" class="form-label">CPU Cores</label>
                        <input type="number" class="form-control" id="cpu" name="cpu" min="1" max="32" required value="1">
                    </div>
                    <div class="col-md-4 mb-3">
                        <label for="disk" class="form-label">Disk (GB)</label>
                        <input type="number" class="form-control" id="disk" name="disk" min="10" max="1000" required value="20">
                    </div>
                </div>

                <div class="mb-3">
                    <label for="custom_dockerfile" class="form-label">Custom Dockerfile (Optional)</label>
                    <input type="file" class="form-control" id="custom_dockerfile" name="custom_dockerfile" accept=".dockerfile,.txt">
                    <div class="form-text">Only used if no OS image is selected.</div>
                </div>

                <div class="mb-3">
                    <label for="additional_ports" class="form-label">Additional Ports (host:container, comma separated)</label>
                    <input type="text" class="form-control" id="additional_ports" name="additional_ports" placeholder="3000:3000,8080:80">
                </div>

                <div class="row">
                    <div class="col-md-4 mb-3">
                        <label for="expires_days" class="form-label">Expires Days</label>
                        <input type="number" class="form-control" id="expires_days" name="expires_days" min="0" value="30">
                    </div>
                    <div class="col-md-4 mb-3">
                        <label for="expires_hours" class="form-label">Hours</label>
                        <input type="number" class="form-control" id="expires_hours" name="expires_hours" min="0" value="0">
                    </div>
                    <div class="col-md-4 mb-3">
                        <label for="expires_minutes" class="form-label">Minutes</label>
                        <input type="number" class="form-control" id="expires_minutes" name="expires_minutes" min="0" value="0">
                    </div>
                </div>

                <div class="mb-3">
                    <label for="bandwidth_limit" class="form-label">Bandwidth Limit (MB)</label>
                    <input type="number" class="form-control" id="bandwidth_limit" name="bandwidth_limit" min="0" value="0">
                    <div class="form-text">0 = unlimited</div>
                </div>

                <div class="mb-3">
                    <label for="tags" class="form-label">Tags (comma separated)</label>
                    <input type="text" class="form-control" id="tags" name="tags" placeholder="web,prod,testing">
                </div>

                <div class="d-flex gap-2 flex-wrap">
                    <button type="submit" class="btn btn-primary">Create VPS</button>
                    <a href="{{ url_for('dashboard') }}" class="btn btn-secondary">Cancel</a>
                </div>
            </form>
        </div>
    </div>
</div>

<script>
    // Auto-disable Dockerfile when OS image is selected
    document.getElementById('os_image').addEventListener('change', function() {
        const dockerfileInput = document.getElementById('custom_dockerfile');
        if (this.value) {
            dockerfileInput.disabled = true;
            dockerfileInput.value = '';
        } else {
            dockerfileInput.disabled = false;
        }
    });

    // Initialize state on load
    document.addEventListener('DOMContentLoaded', function() {
        const osImage = document.getElementById('os_image');
        const dockerfileInput = document.getElementById('custom_dockerfile');
        if (osImage.value) {
            dockerfileInput.disabled = true;
        }
    });
</script>
{% endblock %}
