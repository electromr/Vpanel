{% extends 'base.html' %}

{% block title %}Analytics{% endblock %}

{% block content %}
<style>
    :root {
        --pve-bg: #1a1a1a;
        --pve-panel: #2a2a2a;
        --pve-header: #0f0f0f;
        --pve-border: #404040;
        --pve-text: #e0e0e0;
        --pve-text-muted: #a0a0a0;
        --pve-accent: #007acc;
        --pve-accent-hover: #005a99;
    }

    body {
        background-color: var(--pve-bg);
        color: var(--pve-text);
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        font-size: 0.95rem;
    }

    .container-fluid {
        padding: 2rem 1rem;
    }

    .pve-card {
        background-color: var(--pve-panel);
        border: 1px solid var(--pve-border);
        border-radius: 4px;
        box-shadow: 0 2px 6px rgba(0, 0, 0, 0.4);
        overflow: hidden;
    }

    .pve-header {
        background-color: var(--pve-header);
        border-bottom: 1px solid var(--pve-border);
        padding: 1rem 1.5rem;
        color: #ffffff;
        font-weight: 600;
        font-size: 1.1rem;
    }

    .pve-body {
        padding: 1.5rem;
    }

    h4, h5 {
        color: #ffffff;
        font-weight: 600;
        margin: 0 0 1rem 0;
    }

    h5 {
        font-size: 1.1rem;
        color: #cccccc;
        margin-bottom: 1.25rem;
        padding-bottom: 0.5rem;
        border-bottom: 1px solid var(--pve-border);
    }

    .img-fluid {
        max-width: 100%;
        height: auto;
        border-radius: 4px;
        border: 1px solid var(--pve-border);
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.3);
        background-color: #1e1e1e;
        display: block;
        margin: 0 auto;
    }

    .chart-container {
        background-color: #1e1e1e;
        padding: 1rem;
        border-radius: 4px;
        border: 1px solid var(--pve-border);
        text-align: center;
    }
</style>

<div class="container-fluid">
    <div class="pve-card">
        <div class="pve-header">
            <h4>System Analytics</h4>
        </div>
        <div class="pve-body">
            <h5>CPU Usage Over Time</h5>
            <div class="chart-container">
                <img src="data:image/png;base64,{{ cpu_plot }}" class="img-fluid" alt="CPU Usage Chart">
            </div>
        </div>
    </div>
</div>
{% endblock %}
