{% extends 'base.html' %}

{% block title %}Profile{% endblock %}

{% block content %}
<style>
    .pve-card {
        background-color: var(--pve-panel);
        border: 1px solid var(--pve-border);
        border-radius: 6px;
        box-shadow: 0 2px 6px rgba(0, 0, 0, 0.3);
        overflow: hidden;
        max-width: 700px;
        margin: 2rem auto;
    }

    .pve-header {
        background-color: var(--pve-header);
        border-bottom: 1px solid var(--pve-border);
        padding: 1rem 1.5rem;
        color: #ffffff;
        font-weight: 600;
        font-size: 1.3rem;
        display: flex;
        align-items: center;
        gap: 0.75rem;
    }

    .pve-header .user-icon {
        font-size: 1.2rem;
        color: var(--pve-accent);
    }

    .pve-body {
        padding: 1.5rem;
        color: var(--pve-text);
    }

    .pve-body h5 {
        color: #ffffff;
        font-weight: 600;
        font-size: 1.1rem;
        margin-bottom: 1rem;
        display: flex;
        align-items: center;
        gap: 0.5rem;
    }

    .pve-body h5 .lock-icon {
        font-size: 1rem;
        color: var(--pve-accent);
    }

    .pve-body .form-label {
        font-size: 0.85rem;
        color: var(--pve-text-muted);
        font-weight: 500;
        margin-bottom: 0.5rem;
    }

    .pve-body .form-control,
    .pve-body .form-select {
        background-color: #3a3a3a;
        border: 1px solid var(--pve-border);
        color: var(--pve-text);
        border-radius: 4px;
        padding: 0.65rem 0.75rem;
        font-size: 0.95rem;
        transition: all 0.2s;
    }

    .pve-body .form-control:focus,
    .pve-body .form-select:focus {
        border-color: var(--pve-accent);
        box-shadow: 0 0 0 2px rgba(0, 122, 204, 0.25);
        background-color: #3a3a3a;
        color: var(--pve-text);
    }

    .pve-body .form-control::placeholder {
        color: #777;
    }

    .pve-body hr {
        border-color: var(--pve-border);
        margin: 1.5rem 0;
    }

    .pve-body .btn {
        border-radius: 4px;
        font-weight: 500;
        padding: 0.65rem 1.2rem;
        min-width: 140px;
        transition: all 0.2s;
    }

    .pve-body .btn-primary {
        background-color: var(--pve-accent);
        border-color: var(--pve-accent);
    }

    .pve-body .btn-primary:hover {
        background-color: var(--pve-accent-hover);
        border-color: var(--pve-accent-hover);
    }

    @media (max-width: 768px) {
        .pve-card {
            margin: 1rem;
            border-radius: 4px;
        }
        .pve-header {
            flex-direction: column;
            align-items: flex-start;
            font-size: 1.1rem;
        }
        .pve-header .user-icon {
            font-size: 1.1rem;
        }
        .pve-body {
            padding: 1rem;
        }
        .pve-body .btn {
            width: 100%;
        }
    }
</style>

<div class="container-fluid mt-4">
    <div class="pve-card">
        <div class="pve-header">
            <div class="user-icon">User</div>
            <div>Profile Settings</div>
        </div>

        <div class="pve-body">
            <form method="post">
                <!-- Change Password Section -->
                <h5>
                    <span class="lock-icon">Lock</span>
                    Change Password
                </h5>
                <div class="mb-3">
                    <label for="current_password" class="form-label">Current Password</label>
                    <input type="password" 
                           class="form-control" 
                           id="current_password" 
                           name="current_password" 
                           placeholder="Enter current password" 
                           required>
                </div>
                <div class="mb-3">
                    <label for="new_password" class="form-label">New Password</label>
                    <input type="password" 
                           class="form-control" 
                           id="new_password" 
                           name="new_password" 
                           minlength="12" 
                           placeholder="Minimum 12 characters">
                </div>
                <div class="mb-3">
                    <label for="confirm_password" class="form-label">Confirm New Password</label>
                    <input type="password" 
                           class="form-control" 
                           id="confirm_password" 
                           name="confirm_password" 
                           placeholder="Re-enter new password">
                </div>

                <hr>

                <!-- Other Settings -->
                <div class="mb-3">
                    <label for="email" class="form-label">Email Address</label>
                    <input type="email" 
                           class="form-control" 
                           id="email" 
                           name="email" 
                           value="{{ email or '' }}" 
                           placeholder="user@example.com">
                </div>

                <div class="mb-3">
                    <label for="theme" class="form-label">Theme Preference</label>
                    <select class="form-select" id="theme" name="theme">
                        <option value="light" {% if theme == 'light' %}selected{% endif %}>Light Mode</option>
                        <option value="dark" {% if theme == 'dark' %}selected{% endif %}>Dark Mode</option>
                    </select>
                </div>

                <div class="d-grid">
                    <button type="submit" class="btn btn-primary">Save Changes</button>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
