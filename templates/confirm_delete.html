{% extends "base.html" %}

{% block title %}Delete VPS{% endblock %}

{% block content %}
<style>
    .pve-card {
        background-color: var(--pve-panel);
        border: 1px solid var(--pve-border);
        border-radius: 6px;
        box-shadow: 0 2px 6px rgba(0, 0, 0, 0.3);
        overflow: hidden;
        max-width: 600px;
        margin: 2rem auto;
    }

    .pve-header {
        background-color: var(--pve-header);
        border-bottom: 1px solid var(--pve-border);
        padding: 1rem 1.5rem;
        color: #ffffff;
        font-weight: 600;
        font-size: 1.3rem;
    }

    .pve-body {
        padding: 1.5rem;
        color: var(--pve-text);
    }

    .pve-body p {
        margin-bottom: 1.5rem;
        font-size: 1rem;
        color: #cccccc;
    }

    .pve-body strong {
        color: #ff6b6b;
        font-weight: 600;
    }

    .btn {
        border-radius: 4px;
        font-weight: 500;
        padding: 0.6rem 1.2rem;
        min-width: 130px;
        transition: all 0.2s;
        margin-right: 0.75rem;
    }

    .btn-danger {
        background-color: #dc3545;
        border-color: #dc3545;
    }

    .btn-danger:hover {
        background-color: #c82333;
        border-color: #bd2130;
        transform: translateY(-2px);
    }

    .btn-secondary {
        background-color: #5a5a5a;
        border-color: #5a5a5a;
        color: #e0e0e0;
    }

    .btn-secondary:hover {
        background-color: #4a4a4a;
        border-color: #4a4a4a;
    }

    @media (max-width: 768px) {
        .pve-card {
            margin: 1rem;
            border-radius: 4px;
        }
        .btn {
            width: 100%;
            margin-bottom: 0.5rem;
            margin-right: 0;
        }
    }
</style>

<div class="container mt-5">
    <div class="pve-card">
        <div class="pve-header">
            <h3>Confirm Delete VPS {{ vps_id }}</h3>
        </div>
        <div class="pve-body">
            <p>
                Are you sure you want to delete <strong>VPS {{ vps_id }}</strong>? 
                <strong>This action cannot be undone.</strong>
            </p>
            <form method="POST" action="{{ url_for('delete_vps', vps_id=vps_id) }}">
                <button type="submit" class="btn btn-danger">Confirm Delete</button>
                <a href="{{ url_for('dashboard') }}" class="btn btn-secondary">Cancel</a>
            </form>
        </div>
    </div>
</div>
{% endblock %}
